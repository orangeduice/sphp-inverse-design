# Geometry cVAE: settings of the working Keras 2.15 notebook (cVAE_geomerty_train_IMPORTANT.ipynb).
# Used for the Keras <-> PyTorch training-parity runs. Change settings in a copy, not here.

# data
test_fraction: 0.05      # sklearn train_test_split, seed below
val_fraction: 0.3        # Keras validation_split: last 30 % of the shuffled train+val rows
split_seed: 42
scaler_fit: all          # reference fits the geometry scaler on all samples
freq_slice: null         # full 25-29 THz range; [35, 110] = reduced range 25.875-27.725 THz

# model
latent_dim: 8
n_blocks: 1
shared_eps: true         # reference SamplingRNG draws one epsilon per batch

# loss / optimiser (Keras AdamW defaults)
beta: 0.001              # KL weight (KL is also divided by latent_dim)
lr: 0.0001
weight_decay: 0.004
adam_eps: 1.0e-7

# schedule: [batch_size, epochs] per round; callbacks keep their state across rounds
rounds: [[64, 25], [128, 12]]
reduce_lr_factor: 0.66
reduce_lr_patience: 5
reduce_lr_min_delta: 1.0e-4
early_stop_patience: 15
restore_best: true

allow_tf32: false        # exact float32 for parity runs
