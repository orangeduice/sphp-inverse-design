[project]
name = "sphp-inverse-design"
version = "0.1.0"
description = "cVAE inverse design of SPhP 4H-SiC micropillar metasurfaces (MINAS project)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",
    "scikit-learn>=1.4",
    "torch>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphp_inverse"]

# CUDA 12.8 wheels: needed for the RTX 5070 Ti (Blackwell) and fine on Iridis GPUs.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
